# CI: runs on every push and pull request (including Dependabot's).
# Fails if the app or Cloud Functions don't type-check, the web build
# breaks, the payment (money) tests fail, the Firestore security rules
# tests fail, or the Cloud Functions tests in the emulators fail. The dependency audit is reported but doesn't fail the build,
# because most findings are in Expo's build tools and are fixed by
# upgrading the Expo SDK, not by us.
name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the build runs without real secrets. The real values
      # live in .env on your machine / your host's environment settings.
      EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
      EXPO_PUBLIC_FIREBASE_APP_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo export --platform web
      - run: npx tsc --noEmit
      - name: Dependency audit (production packages)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  functions:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      # In-memory tests of every money path (functions/test/payments.test.js).
      - run: npm run test:payments
      # Group-order picker: store distances and which orders make a group.
      - run: npm run test:grouping
      # Proximity pricing: fee curve, split, campus distances.
      - run: npm run test:pricing
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # firestore.rules against the Firestore emulator (firestore-tests/).
  # The rules are the only thing between the app and other people's data,
  # so a change that breaks them must not merge.
  rules:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firestore-tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: firestore-tests/package-lock.json }
      - uses: actions/setup-java@v4   # the Firestore emulator runs on Java
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}
      - run: npm ci
      - run: npm test

  # The real Cloud Functions in the emulators (firestore-tests/triggers.test.mjs):
  # order checking, duplicates and limits, delivery credit, the user trigger
  # and the scheduler. functions/.env.demo-dormdash supplies the (public,
  # sandbox) settings the emulator would otherwise stop and ask for.
  triggers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            firestore-tests/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}
      - run: npm ci
        working-directory: functions
      - run: npm ci
        working-directory: firestore-tests
      - run: npm run test:triggers
        working-directory: firestore-tests
